[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall-relay"
version = "0.1.0"
description = "Every recall, every pantry, with proof. A Strands agent that runs a food bank's recall procedure across its partner pantries."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "strands-agents[openai,anthropic]>=1.55.1",
    "strands-agents-tools>=0.8.8",
    "bedrock-agentcore>=1.23.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "boto3>=1.35",
    "pypdf>=5.0",
    "feedparser>=6.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["app/recall_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
