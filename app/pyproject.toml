[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall-relay-runtime"
version = "0.1.0"
description = "AgentCore Runtime package for Recall Relay (Strands Agents)"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore >= 1.23.0",
    "botocore[crt] >= 1.35.0",
    "strands-agents[openai,anthropic] >= 1.55.1",
    "strands-agents-tools >= 0.8.8",
    "pydantic >= 2.8",
    "httpx >= 0.27",
    "rapidfuzz >= 3.9",
    "python-dateutil >= 2.9",
    "feedparser >= 6.0",
    "pypdf >= 5.0",
    "python-dotenv >= 1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["recall_relay"]
