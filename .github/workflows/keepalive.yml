name: keep the demo warm

# Render's free instances sleep after 15 idle minutes and take ~50 s to wake, which is a bad first
# click for a judge. A health ping every 14 minutes keeps the demo warm during the judging window.
# Disable this workflow after October 8, 2026.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ping /api/health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://recall-relay.onrender.com/api/health || echo 000)
          echo "health -> $code"
